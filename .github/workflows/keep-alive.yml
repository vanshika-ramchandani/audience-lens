name: keep-app-awake

# Pings the Streamlit app on a schedule so the free-tier app never goes to
# sleep (Streamlit Community Cloud apps sleep after inactivity; any request
# resets that timer). Also runnable on demand from the Actions tab.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:        # manual run button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping AudienceLens app
        run: |
          URL="https://audience-lens-nckdhnkm6fgnu9ryzbtrzf.streamlit.app/"
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 90 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "App is awake."; exit 0; fi
            sleep 30
          done
          echo "App did not return 200 yet (likely cold-starting) - pinged anyway."
